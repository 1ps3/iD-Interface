<!DOCTYPE html>
<html lang="en" class="tray-menu-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iD Interface Tray Menu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="tray-menu-body">
  <div class="tray-menu-card" id="trayMenuCard" role="menu" aria-label="iD Interface">
    <div class="tray-menu-head">
      <span class="tray-status-dot" id="trayDot" aria-hidden="true"></span>
      <span class="tray-device-name" id="trayDeviceName">iD INTERFACE</span>
    </div>

    <div class="tray-menu-sep" role="separator"></div>

    <button type="button" class="tray-menu-item" data-action="show" role="menuitem">
      <svg class="tray-ico" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2.5" width="12" height="11" rx="2" />
        <line x1="2" y1="5.5" x2="14" y2="5.5" />
      </svg>
      <span class="tray-item-label" id="lblShow">Open iD Interface</span>
    </button>

    <button type="button" class="tray-menu-item" data-action="toggle_mode" role="menuitem">
      <svg class="tray-ico" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 6.5L13.5 2.5M10 2.5H13.5V6" />
        <path d="M6.5 9.5L2.5 13.5M6 13.5H2.5V10" />
      </svg>
      <span class="tray-item-label" id="lblMode">Compact Widget</span>
    </button>

    <button type="button" class="tray-menu-item" data-action="toggle_mute" id="btnTrayMute" role="menuitem">
      <svg class="tray-ico" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 6.2H5.2L8.8 3.2V12.8L5.2 9.8H2.5V6.2Z" />
        <path d="M11.2 5.8L14 10.2M14 5.8L11.2 10.2" />
      </svg>
      <span class="tray-item-label">Mute Main</span>
      <span class="tray-pill" id="trayMutePill">OFF</span>
    </button>

    <div class="tray-menu-sep" role="separator"></div>

    <button type="button" class="tray-menu-item is-danger" data-action="quit" role="menuitem">
      <svg class="tray-ico" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 2.2V7.8" />
        <path d="M4.6 4.2A5.2 5.2 0 1 0 11.4 4.2" />
      </svg>
      <span class="tray-item-label">Quit</span>
    </button>
  </div>

  <script type="module">
    import { applyThemeToDocument } from "./js/themes.js";

    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const dotEl = document.getElementById("trayDot");
    const devEl = document.getElementById("trayDeviceName");
    const lblShow = document.getElementById("lblShow");
    const lblMode = document.getElementById("lblMode");
    const btnMute = document.getElementById("btnTrayMute");
    const mutePill = document.getElementById("trayMutePill");

    function applyState(st) {
      if (!st) return;
      if (typeof st.theme === "string") {
        applyThemeToDocument(st.theme);
      }
      dotEl.classList.toggle("connected", Boolean(st.connected));
      const dev = (st.deviceName || "").trim();
      devEl.textContent = st.connected && dev ? dev.toUpperCase() : "iD INTERFACE";
      lblShow.textContent = st.isVisible ? "Focus iD Interface" : "Open iD Interface";
      lblMode.textContent = st.isCompact ? "Full Console Mode" : "Compact Widget";
      const muted = Boolean(st.isMuted);
      btnMute.classList.toggle("is-muted", muted);
      mutePill.textContent = muted ? "MUTED" : "LIVE";
    }

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.querySelectorAll(".tray-menu-item[data-action]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        if (action) {
          invoke("tray_menu_action", { action }).catch(() => {});
        }
      });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        invoke("hide_tray_menu").catch(() => {});
      }
    });

    listen("tray-menu-state", (e) => applyState(e.payload));
    listen("theme-changed", (e) => {
      if (typeof e.payload === "string") applyThemeToDocument(e.payload);
    });

    invoke("get_tray_menu_state").then(applyState).catch(() => {
      applyThemeToDocument("obsidian");
    });
  </script>
</body>
</html>
