[package]
name = "id-interface"
version = "0.2.1"
description = "Open-source studio console, DSP mixer, and floating controller for Audient iD1, iD2, iD2+, and iD4+ (MK3) audio interfaces"
authors = ["1ps3"]
license = "MIT"
repository = "https://github.com/1ps3/iD-Interface"
edition = "2021"

[lib]
name = "id_interface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
