<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e22" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="100%" stop-color="#1d1d22" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
  </defs>

  <!-- Matte Obsidian Squircle -->
  <rect x="88" y="88" width="848" height="848" rx="192" ry="192" fill="url(#bg)" />

  <!-- Outer 270-degree Level Arc (7:30 to 4:30, lit to 2 o'clock) -->
  <path d="M 299.87 724.13 A 300 300 0 1 1 724.13 724.13" fill="none" stroke="#313137" stroke-width="38" stroke-linecap="round" />
  <path d="M 299.87 724.13 A 300 300 0 1 1 770.22 359.29" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" />

  <!-- Center Knob -->
  <circle cx="512" cy="520" r="198" fill="rgba(0,0,0,0.38)" />
  <circle cx="512" cy="512" r="196" fill="url(#knob)" stroke="#46464f" stroke-width="7" />

  <!-- Crisp White Pointer -->
  <line x1="579.14" y1="472.29" x2="641.11" y2="435.64" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
</svg>
